name: Build Claude Desktop extension

# Builds claude-garmin.mcpb on every PR/push (as a downloadable workflow
# artifact) and attaches it to the GitHub Release when a v* tag is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check manifest is in sync with the server
        run: python scripts/check_manifest.py

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c 'import json;print(json.load(open("manifest.json"))["version"])')"
          if [ "$want" != "$have" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $have" >&2
            exit 1
          fi

      - name: Pack extension
        run: npx -y @anthropic-ai/mcpb pack . claude-garmin.mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: claude-garmin-mcpb
          path: claude-garmin.mcpb

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: claude-garmin.mcpb
